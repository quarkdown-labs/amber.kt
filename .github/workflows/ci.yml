name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'version.txt'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  pull_request:
    branches: ["**"]
  workflow_call:

jobs:
  build:
    # Kotlin/Native builds what its host supports: Linux covers the Linux targets, macOS the Apple ones.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew --no-daemon test allTests

      - name: Assemble every target
        if: matrix.os == 'macos-latest'
        run: ./gradlew --no-daemon :annotations:assemble
